[tools]
# damap-backend:
java = "temurin-21.0.12+101.0.LTS"
maven = "3.10.0"
# damap-frontend:
node = "22.23.3"
"npm:@angular/cli" = "19.2.18"
# damap-helper:
rust = "1.99.0"

# `sudo mise run` would otherwise install all of the above for root first.
[settings]
task.run_auto_install = false

[tasks.damap-start]
description = "Start DAMAP"
dir = "damap-backend"
run = "docker compose up -d --wait"

[tasks.damap-stop]
description = "Stop DAMAP"
dir = "damap-backend"
run = "docker compose down"
