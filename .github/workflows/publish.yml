# Publishes damap-helper on every push to main.
#
# Picks the next version (the version in damap-helper/Cargo.toml, or the
# patch after the latest tag if that is already released), commits the bump
# on a detached release commit, tags it and starts release.yml on that tag.
# main itself is never written to.
name: Publish

on:
  push:
    branches: [main]

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Pick the next version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          manifest=damap-helper/Cargo.toml
          current=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$manifest" | head -1)
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          latest=${latest#v}
          if [ -z "$latest" ] || [ "$(printf '%s\n%s\n' "$latest" "$current" | sort -V | tail -1)" != "$latest" ]; then
            next=$current
          else
            IFS=. read -r major minor patch <<<"${latest%%-*}"
            next="$major.$minor.$((patch + 1))"
          fi
          echo "Releasing $next (Cargo.toml: $current, latest tag: ${latest:-none})"
          echo "version=$next" >> "$GITHUB_OUTPUT"
      - name: Tag a release commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          sed -i "0,/^version = \".*\"$/s//version = \"$VERSION\"/" damap-helper/Cargo.toml
          # Keep Cargo.lock in step with the new version.
          sed -i "/^name = \"damap-helper\"$/{n;s/^version = \".*\"$/version = \"$VERSION\"/}" Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -am "Release v$VERSION"
          git tag "v$VERSION"
          git push origin "v$VERSION"
      - name: Start the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh workflow run release.yml --ref "v$VERSION" -f tag="v$VERSION"
