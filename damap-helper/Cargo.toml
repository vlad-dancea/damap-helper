[package]
name = "damap-helper"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dialoguer = "0.12.0"
jiff = "0.2.37"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
open = "5.4.4"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "form", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"
